extends: qwen3-4b.yaml
project:
  model_version: ai-upchar-med-part2-advanced-v5.0.0
  dataset_version: part2-advanced-v5.0.0
  evaluation_version: part2-advanced-eval-v5.0.0
model:
  max_sequence_length: 512
training:
  method: qlora
  output_dir: artifacts/qwen3-4b-part2-advanced
  max_steps: 3750
  num_train_epochs: 3
  epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  eval_split: 0.10
  logging_steps: 50
  save_steps: 500
  append_assistant_eos: true
quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: float16
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
data:
  sft_path: data/sft/part2_advanced_sft.jsonl
  evaluation_path: data/evaluation/part2_advanced_held_out.jsonl
  candidate_preproduction_only: true
  production_approved: false
