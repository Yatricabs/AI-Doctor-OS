extends: qwen3-4b.yaml
project:
  model_version: ai-upchar-med-real-validation-v0.1.0
  dataset_version: synthetic-real-validation-v0.1.0
  evaluation_version: real-validation-eval-v0.1.0
model:
  max_sequence_length: 256
training:
  method: qlora
  output_dir: artifacts/qwen3-4b-real-validation
  max_steps: 2
  epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  eval_split: 0.25
  logging_steps: 1
  save_steps: 2
quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: float16
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
data:
  sft_path: data/sft/real_validation_synthetic.jsonl
  evaluation_path: data/evaluation/smoke.jsonl
