extends: qwen3-4b.yaml
project:
  model_version: ai-upchar-med-e3-targeted-safety-v0.1.0
  dataset_version: e3-targeted-safety-v0.1.0
  evaluation_version: e3-heldout-safety-v0.1.0
model:
  max_sequence_length: 256
training:
  method: qlora
  output_dir: artifacts/qwen3-4b-e3-targeted-safety
  # Calculated training budget:
  # train_examples = 24
  # effective_batch = 1 * 2 = 2
  # steps_per_epoch = 24 / 2 = 12
  # epochs = 3
  # max_steps = 12 * 3 = 36
  max_steps: 36
  num_train_epochs: 3
  epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  eval_split: 0.1667
  logging_steps: 2
  save_steps: 12
  append_assistant_eos: true
quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: float16
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
data:
  sft_path: data/sft/e3_targeted_safety_train.jsonl
  evaluation_path: data/evaluation/e3_targeted_safety_heldout.jsonl
