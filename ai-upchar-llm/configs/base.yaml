project:
  model_version: ai-upchar-med-v0.1.0
  dataset_version: smoke-v0.1.0
  evaluation_version: eval-v0.1.0
  seed: 42
model:
  name: Qwen/Qwen3-8B-Base
  trust_remote_code: false
  max_sequence_length: 4096
training:
  method: qlora
  output_dir: artifacts/ai-upchar-med-v0.1.0
  epochs: 1
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  bf16: true
  assistant_only_loss: true
  eval_split: 0.1
  save_steps: 100
  logging_steps: 10
quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
data:
  sft_path: data/sft/smoke.jsonl
  evaluation_path: data/evaluation/smoke.jsonl
  max_samples: null
inference:
  port: 8001
  max_model_len: 4096
  gpu_memory_utilization: 0.90
  tensor_parallel_size: 1
