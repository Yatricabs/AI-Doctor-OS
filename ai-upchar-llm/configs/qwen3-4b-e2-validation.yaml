extends: qwen3-4b.yaml
project:
  model_version: ai-upchar-med-e2-validation-v0.1.0
  dataset_version: e2-contract-v0.1.0
  evaluation_version: e2-held-out-eval-v0.1.0
model:
  max_sequence_length: 256
training:
  method: qlora
  output_dir: artifacts/qwen3-4b-e2-validation
  max_steps: 138
  num_train_epochs: 3
  epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  eval_split: 0.25
  logging_steps: 5
  save_steps: 46
quantization:
  enabled: true
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: float16
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
data:
  sft_path: data/sft/e2_contract_sft.jsonl
  evaluation_path: data/evaluation/e2_held_out_contract.jsonl
