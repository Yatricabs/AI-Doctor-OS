[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-upchar-llm"
version = "0.1.0"
description = "Privacy-first training, evaluation, and inference workspace for AI UPCHAR"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.9.1",
  "transformers==4.57.3",
  "datasets==4.4.1",
  "trl==0.25.1",
  "peft==0.18.0",
  "accelerate==1.12.0",
  "PyYAML==6.0.3",
  "pydantic==2.12.5",
  "safetensors==0.7.0",
]

[project.optional-dependencies]
cuda = ["bitsandbytes==0.48.2"]
serve = ["vllm==0.12.0", "fastapi==0.124.0", "uvicorn==0.38.0"]
dev = ["pytest==9.0.1", "ruff==0.14.7", "httpx==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_upchar_llm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
